name: Readme Update

on:
  # GitHub Actions 화면에서 수동 실행 버튼을 표시합니다.
  workflow_dispatch:
  schedule:
    # 1시간마다 실행합니다.
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
      - name: Install dependencies
        run: npm ci
      - name: Update README
        run: npm start
      - name: Commit README
        run: |
          git add .
          git config --local user.email "guswnsgur2276@gmail.com"
          git config --local user.name "HYH0804"
          git diff --cached --quiet || git commit -m "Update README.md"
          git push
